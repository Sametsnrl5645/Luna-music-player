name: Android Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        gradle-version: ['8.4']
        java-version: ['17']

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1.1. List Repository Contents (Dizin Yapısını Göster)
        run: |
          echo "Kök dizindeki dosyalar:"
          ls -la
          echo "Mevcut dizin:"
          pwd

      - name: 2. Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: 4. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4.1. Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 4.2. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 4.3. Install Android SDK Components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Validate Resources
        run: |
          echo "Checking for essential resources..."
          if [ ! -d "app/src/main/res/values" ]; then
            echo "HATA: values klasörü bulunamadı!"
            exit 1
          fi
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
             echo "HATA: themes.xml dosyası bulunamadı!"
             exit 1
          fi
          echo "Kaynak dosyaları doğrulandı."

      - name: 6. Build APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace --info
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ORG_GRADLE_PROJECT_android_useAndroidX: true
          
      - name: 7. Find All Build Folders and APKs
        run: |
          echo "Projedeki tüm build klasörleri ve APK dosyaları aranıyor:"
          find . -name "*.apk" -o -type d -name "build"

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaAI-Music-Player-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
