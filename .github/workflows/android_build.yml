name: Android Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        gradle-version: ['8.4']
        java-version: ['17']

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1.1. List Repository Contents (Dizin Yapısını Göster)
        run: |
          echo "Kök dizindeki dosyalar:"
          ls -la
          echo "app dizini içeriği:"
          ls -la app/ || true
          echo "Mevcut dizin:"
          pwd

      - name: 2. Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: 4. Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 4.1. Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 4.2. Accept Android SDK Licenses & Install Components
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Validate Android Structure
        run: |
          echo "Checking for essential Android files..."
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "HATA: app/src/main/AndroidManifest.xml bulunamadı!"
            exit 1
          fi
          echo "AndroidManifest.xml doğrulandı."

      - name: 6. Check Gradle Projects & Build APK
        run: |
          echo "Gradle projeleri listeleniyor:"
          ./gradlew projects
          
          echo "Derleme başlatılıyor:"
          ./gradlew clean :app:assembleDebug --stacktrace --info
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ORG_GRADLE_PROJECT_android_useAndroidX: true
          
      - name: 7. Find All Build Folders and APKs
        run: |
          echo "Projedeki tüm build klasörleri ve APK dosyaları aranıyor:"
          find . -name "*.apk" -o -type d -name "build"

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaAI-Music-Player-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
