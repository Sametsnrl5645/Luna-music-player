name: Android Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        gradle-version: ['8.4']
        java-version: ['17']

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1.1. Debug - Find all APKs in workspace
        run: |
          echo "Workspace içindeki tüm APK dosyaları aranıyor:"
          find . -name "*.apk"
          echo "App klasörünün içeriği:"
          ls -la app/ || true
          echo "App build klasörünün içeriği:"
          ls -la app/build/ || true
          
      - name: 2. Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: 4. Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: 4.1 Setup Direct SSH Terminal
        run: |
          # 1. SSH sunucusunu başlat ve aktif et
          sudo systemctl enable --now ssh
          
          # 2. Runner kullanıcısına şifre ata (terminale bağlanabilmek için)
          echo "runner:password123" | sudo chpasswd
          
          # 3. Dışarıdan SSH bağlantısına izin ver
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          # 4. Bağlantı için gerekli IP adresini ekrana yazdır
          echo "=== SSH BAĞLANTI BİLGİLERİ ==="
          echo "IP Adresi:"
          hostname -I
          echo "Kullanıcı adı: runner"
          echo "Şifre: password123"
          echo "================================"
          
          # 5. İşlemin bitmemesi ve senin komut yazabilmen için süreci askıya al
          echo "Terminal aktif! İşlemi durdurmak için Ctrl+C yapabilirsin veya runner'ın bitmesini bekleyebilirsin."
          sleep 600
        shell: bash
          
      - name: 4.2. Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 4.3. Safe Android SDK Setup & Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          
          # Lisans dosyalarını doğrudan oluşturuyoruz (Asla takılmaz, anında biter)
          echo "24333f8a63b6825ea3c5514f83c2829b004d1fb8" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b4039cb474c14fe79163b154098935c1599" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d975f751698a77b660f125456ebca7cfc137f8d6" >> $ANDROID_HOME/licenses/android-sdk-preview-license
          
          # Bileşenleri güvenli ve zaman aşımı korumalı kur (Asla kilitlenmez)
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Bileşenler yükleniyor..."
            timeout 120s yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "Cmdline-tools yolu farklı, alternatif kontrol ediliyor..."
            sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          fi
          
      - name: 5. Validate Android Structure
        run: |
          echo "Checking for essential Android files..."
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "HATA: app/src/main/AndroidManifest.xml bulunamadı!"
            exit 1
          fi
          echo "AndroidManifest.xml doğrulandı."

      - name: 6. Check Gradle Projects & Build APK
        run: |
          echo "Gradle projeleri listeleniyor:"
          ./gradlew projects
          
          echo "Derleme başlatılıyor:"
          ./gradlew clean :app:assembleDebug --stacktrace --info
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ORG_GRADLE_PROJECT_android_useAndroidX: true
          
      - name: 7. Find All Build Folders and APKs
        run: |
          echo "Projedeki tüm build klasörleri ve APK dosyaları aranıyor:"
          find . -name "*.apk" -o -type d -name "build"

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaAI-Music-Player-Debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
